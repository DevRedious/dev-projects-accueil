<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dev project's — Accueil</title>
<meta name="description" content="Dev project's — studio de développement créatif. Là où la nature rencontre le code." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cinzel:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --accent: #9be35a;
    --mo: 1;
    --bg-l: 0.182;          /* "Obscurité du fond" 32 % → 0.10 + 0.68·0.12 */
    --label-font: 'Oswald', sans-serif;
    --circuit-img: none;    /* set by script from --accent */
    --ink: #eaf3e4;
    --ink-dim: #9fb39a;
  }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0d0a;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .dp-root {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  /* ---------- background layers ---------- */
  .dp-bg-base, .dp-bg-circuit, .dp-bg-glow, .dp-vignette {
    position: fixed; inset: 0; z-index: -3; pointer-events: none;
  }
  .dp-bg-base {
    background:
      radial-gradient(120% 90% at 50% -10%, oklch(calc(var(--bg-l) + 0.05) 0.03 150) 0%, transparent 55%),
      oklch(var(--bg-l) 0.014 150);
  }
  .dp-bg-circuit {
    z-index: -2;
    background-image: var(--circuit-img);
    background-size: 300px 300px;
    opacity: 0.055;
    animation: circuitDrift 38s linear infinite, circuitPulse 7s ease-in-out infinite;
    -webkit-mask-image: radial-gradient(125% 100% at 50% 38%, #000 0%, #000 42%, transparent 80%);
            mask-image: radial-gradient(125% 100% at 50% 38%, #000 0%, #000 42%, transparent 80%);
  }
  @keyframes circuitDrift {
    from { background-position: 0 0; }
    to   { background-position: 300px 300px; }
  }
  @keyframes circuitPulse {
    0%, 100% { opacity: 0.04; }
    50%      { opacity: 0.10; }
  }
  .dp-bg-glow {
    z-index: -2;
    background:
      radial-gradient(46% 38% at 50% 40%, color-mix(in oklch, var(--accent) 16%, transparent) 0%, transparent 70%);
    opacity: 0.7;
    animation: glowBreathe 8s ease-in-out infinite;
  }
  @keyframes glowBreathe {
    0%, 100% { opacity: 0.5; transform: scale(0.97); }
    50%      { opacity: 0.85; transform: scale(1.04); }
  }
  .dp-vignette {
    z-index: -1;
    background: radial-gradient(130% 120% at 50% 30%, transparent 55%, #05070500 60%, #040603 100%);
  }

  /* ---------- particles ---------- */
  .dp-particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .dp-spore {
    position: absolute; bottom: -6%;
    border-radius: 50%;
    filter: blur(0.4px);
    box-shadow: 0 0 8px 1px currentColor;
    color: var(--accent);
    mix-blend-mode: screen;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 0.9; }
    100% { transform: translateY(-112vh) translateX(var(--drift)) scale(1); opacity: 0; }
  }

  /* ---------- header ---------- */
  .dp-header {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(18px, 3vw, 34px) clamp(20px, 4vw, 56px);
  }
  .dp-brand { display: flex; align-items: center; gap: 14px; }
  .dp-code {
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: clamp(20px, 2vw, 26px);
    color: var(--accent);
    text-shadow: 0 0 12px color-mix(in oklch, var(--accent) 70%, transparent);
    letter-spacing: 1px;
  }
  .dp-brand-name {
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing: 3.5px; color: var(--ink-dim);
  }
  .dp-fr {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px;
    color: var(--ink-dim);
    border: 1px solid color-mix(in oklch, var(--ink-dim) 35%, transparent);
    border-radius: 999px; padding: 6px 13px;
  }

  /* ---------- main ---------- */
  .dp-main {
    position: relative; z-index: 1;
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: clamp(4px, 1vw, 14px) clamp(20px, 4vw, 56px) clamp(14px, 2vw, 26px);
    gap: clamp(8px, 1.1vw, 15px);
  }

  .dp-logo-wrap {
    width: clamp(220px, 29vw, 400px);
    line-height: 0;
    opacity: 0; transform: translateY(16px) scale(0.97);
    transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.9,.25,1);
  }
  .dp-logo-wrap.is-in { opacity: 1; transform: none; }
  .dp-logo {
    width: 100%; height: auto; display: block;
    -webkit-mask-image: radial-gradient(72% 70% at 50% 46%, #000 52%, transparent 86%);
            mask-image: radial-gradient(72% 70% at 50% 46%, #000 52%, transparent 86%);
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.55));
  }

  .dp-kicker {
    margin: 0;
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: clamp(10px, 1.05vw, 13px); letter-spacing: clamp(3px, 0.5vw, 6px);
    color: color-mix(in oklch, var(--accent) 78%, #cfe4c2);
    text-shadow: 0 0 16px color-mix(in oklch, var(--accent) 40%, transparent);
    opacity: 0; transform: translateY(12px);
    transition: opacity .8s ease .15s, transform .8s ease .15s;
  }
  .dp-kicker.is-in { opacity: 0.95; transform: none; }

  .dp-headline {
    margin: 0;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: clamp(18px, 2.5vw, 34px); line-height: 1.12;
    color: #f2f6ec; text-wrap: balance; max-width: 18ch;
    text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    opacity: 0; transform: translateY(14px);
    transition: opacity .9s ease .3s, transform .9s ease .3s;
  }
  .dp-headline.is-in { opacity: 1; transform: none; }

  /* ---------- nav grid ---------- */
  .dp-nav {
    margin-top: clamp(8px, 1.6vw, 22px);
    width: min(1000px, 100%);
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(14px, 2.2vw, 34px) clamp(18px, 3vw, 46px);
  }

  /* ---------- branch button ---------- */
  .dp-btn {
    position: relative; display: block;
    aspect-ratio: 913 / 352;
    text-decoration: none;
    opacity: 0;
    transform: scale(0.62) translateY(16px) rotate(-1.4deg);
    transform-origin: 50% 62%;
    transition: opacity .55s ease var(--in-delay),
                transform .7s cubic-bezier(.2,1.3,.34,1) var(--in-delay);
    -webkit-tap-highlight-color: transparent;
  }
  .dp-btn.is-in { opacity: 1; transform: none; }

  .dp-btn-lift {
    position: absolute; inset: 0;
    transition: transform .28s cubic-bezier(.2,.9,.25,1), filter .28s ease;
    will-change: transform;
  }
  .dp-btn:hover .dp-btn-lift { transform: translateY(-7px) scale(1.045); }
  .dp-btn:active .dp-btn-lift { transform: translateY(-1px) scale(0.985); }

  .dp-btn-sway {
    position: absolute; inset: 0;
    transform-origin: 50% 82%;
    animation: sway 4.8s ease-in-out infinite;
    animation-delay: var(--sway-delay);
  }
  @keyframes sway {
    0%   { transform: rotate(calc(-1.5deg * var(--mo))) translateY(calc(0.5px * var(--mo))); }
    50%  { transform: rotate(calc(1.5deg * var(--mo)))  translateY(calc(-1.6px * var(--mo))); }
    100% { transform: rotate(calc(-1.5deg * var(--mo))) translateY(calc(0.5px * var(--mo))); }
  }
  .dp-btn-art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
    transition: filter .28s ease;
  }
  .dp-btn:hover .dp-btn-art {
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.55))
            drop-shadow(0 0 16px color-mix(in oklch, var(--hue) 55%, transparent));
  }
  .dp-btn-glow {
    position: absolute; left: 50%; top: 50%; width: 60%; height: 52%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, var(--hue) 0%, transparent 72%);
    mix-blend-mode: screen; filter: blur(7px);
    opacity: 0; pointer-events: none;
    animation: pulse 3.6s ease-in-out infinite alternate;
    animation-delay: var(--sway-delay);
  }
  @keyframes pulse {
    from { opacity: calc(0.18 * var(--mo)); transform: translate(-50%, -50%) scale(0.82); }
    to   { opacity: calc(0.55 * var(--mo)); transform: translate(-50%, -50%) scale(1.06); }
  }
  .dp-btn:hover .dp-btn-glow { animation: none; opacity: 0.7; transform: translate(-50%,-50%) scale(1.12); }

  /* traveling current along the printed-circuit traces */
  .dp-btn-current {
    position: absolute; left: 7%; top: 50%; width: 86%; height: 30%;
    transform: translateY(-50%);
    pointer-events: none; overflow: hidden; mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
  }
  .dp-btn-current::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%;
    background: linear-gradient(90deg,
      transparent 0%,
      color-mix(in oklch, var(--hue) 60%, #ffffff) 44%,
      color-mix(in oklch, var(--hue) 98%, #ffffff) 50%,
      color-mix(in oklch, var(--hue) 60%, #ffffff) 56%,
      transparent 100%);
    filter: blur(4px);
    opacity: 0;
    animation: current 3.1s linear infinite;
    animation-delay: var(--sway-delay);
  }
  @keyframes current {
    0%   { transform: translateX(-130%); opacity: 0; }
    16%  { opacity: var(--mo); }
    84%  { opacity: var(--mo); }
    100% { transform: translateX(320%); opacity: 0; }
  }
  .dp-btn:hover .dp-btn-current::before { animation-duration: 1.5s; }

  .dp-btn-scrim {
    position: absolute; left: 50%; top: 50%; width: 64%; height: 46%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(4,8,4,0.66) 0%, rgba(4,8,4,0.28) 55%, transparent 78%);
    pointer-events: none;
  }
  .dp-btn-label {
    position: absolute; left: 50%; top: 49%;
    transform: translate(-50%, -50%);
    font-family: var(--label-font); font-weight: 600;
    font-size: clamp(0.95rem, 2vw, 1.6rem);
    letter-spacing: 0.06em; white-space: nowrap;
    color: #f4fbef;
    text-shadow:
      0 0 1px var(--hue),
      0 0 10px color-mix(in oklch, var(--hue) 85%, transparent),
      0 0 22px color-mix(in oklch, var(--hue) 60%, transparent),
      0 2px 4px rgba(0,0,0,0.6);
    transition: text-shadow .28s ease, color .2s ease;
    pointer-events: none;
  }
  .dp-btn:hover .dp-btn-label {
    color: #fff;
    text-shadow:
      0 0 2px #fff,
      0 0 12px var(--hue),
      0 0 30px color-mix(in oklch, var(--hue) 80%, transparent),
      0 0 48px color-mix(in oklch, var(--hue) 50%, transparent);
  }

  /* ---------- footer ---------- */
  .dp-footer {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px;
    padding: clamp(14px, 2vw, 26px) clamp(20px, 4vw, 56px);
    font-family: 'JetBrains Mono', monospace;
  }
  .dp-foot-code { color: var(--accent); font-weight: 600; opacity: 0.8;
    text-shadow: 0 0 10px color-mix(in oklch, var(--accent) 55%, transparent); }
  .dp-foot-text { font-size: clamp(10px, 1vw, 12px); letter-spacing: 1.5px; color: var(--ink-dim); }
  .dp-foot-sparkle { margin-left: auto; }

  .dp-sparkle {
    display: inline-block; width: 30px; height: 30px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
    filter: drop-shadow(0 0 8px color-mix(in oklch, var(--accent) 75%, transparent));
    opacity: 0.85;
    animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.45; transform: scale(0.9) rotate(0deg); }
    50%      { opacity: 0.95; transform: scale(1.08) rotate(45deg); }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .dp-nav { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 470px) {
    .dp-nav { grid-template-columns: 1fr; gap: 12px; max-width: 320px; }
    .dp-brand-name { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dp-btn { opacity: 1 !important; transform: none !important; transition: none !important; }
    .dp-btn-sway, .dp-btn-glow, .dp-btn-current::before, .dp-spore, .dp-sparkle,
    .dp-bg-circuit, .dp-bg-glow { animation: none !important; }
    .dp-btn-glow { opacity: calc(0.3 * var(--mo)); }
    .dp-logo-wrap, .dp-kicker, .dp-headline { transition: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="dp-root">
    <div class="dp-bg-base"></div>
    <div class="dp-bg-circuit"></div>
    <div class="dp-bg-glow"></div>
    <div class="dp-particles" aria-hidden="true"></div>
    <div class="dp-vignette"></div>

    <header class="dp-header">
      <div class="dp-brand">
        <span class="dp-code">&lt;/&gt;</span>
        <span class="dp-brand-name">DEV&nbsp;PROJECT'S</span>
      </div>
      <div class="dp-fr">FR</div>
    </header>

    <main class="dp-main">
      <p class="dp-kicker">STUDIO DE DÉVELOPPEMENT CRÉATIF</p>

      <div class="dp-logo-wrap">
        <img class="dp-logo" src="assets/logo-tree.png" alt="Dev project's" draggable="false" />
      </div>

      <h1 class="dp-headline">Là où la nature rencontre le code.</h1>

      <nav class="dp-nav" aria-label="Navigation principale">
        <a href="#" class="dp-btn" style="--hue:#5cd4e8; --in-delay:0s;    --sway-delay:0s;"    aria-label="ACCUEIL">
          <span class="dp-btn-lift"><span class="dp-btn-sway"><img class="dp-btn-art" src="assets/btn-plate.png" alt="" draggable="false" /><span class="dp-btn-glow"></span><span class="dp-btn-current"></span></span><span class="dp-btn-scrim"></span><span class="dp-btn-label">ACCUEIL</span></span>
        </a>
        <a href="#" class="dp-btn" style="--hue:#ecc06a; --in-delay:0.12s; --sway-delay:-0.9s;" aria-label="À PROPOS">
          <span class="dp-btn-lift"><span class="dp-btn-sway"><img class="dp-btn-art" src="assets/btn-plate.png" alt="" draggable="false" /><span class="dp-btn-glow"></span><span class="dp-btn-current"></span></span><span class="dp-btn-scrim"></span><span class="dp-btn-label">À PROPOS</span></span>
        </a>
        <a href="#" class="dp-btn" style="--hue:#9be35a; --in-delay:0.24s; --sway-delay:-1.8s;" aria-label="SERVICES">
          <span class="dp-btn-lift"><span class="dp-btn-sway"><img class="dp-btn-art" src="assets/btn-plate.png" alt="" draggable="false" /><span class="dp-btn-glow"></span><span class="dp-btn-current"></span></span><span class="dp-btn-scrim"></span><span class="dp-btn-label">SERVICES</span></span>
        </a>
        <a href="#" class="dp-btn" style="--hue:#b48bf0; --in-delay:0.36s; --sway-delay:-2.7s;" aria-label="PORTFOLIO">
          <span class="dp-btn-lift"><span class="dp-btn-sway"><img class="dp-btn-art" src="assets/btn-plate.png" alt="" draggable="false" /><span class="dp-btn-glow"></span><span class="dp-btn-current"></span></span><span class="dp-btn-scrim"></span><span class="dp-btn-label">PORTFOLIO</span></span>
        </a>
        <a href="#" class="dp-btn" style="--hue:#5fe0c0; --in-delay:0.48s; --sway-delay:-3.6s;" aria-label="CONTACT">
          <span class="dp-btn-lift"><span class="dp-btn-sway"><img class="dp-btn-art" src="assets/btn-plate.png" alt="" draggable="false" /><span class="dp-btn-glow"></span><span class="dp-btn-current"></span></span><span class="dp-btn-scrim"></span><span class="dp-btn-label">CONTACT</span></span>
        </a>
        <a href="#" class="dp-btn" style="--hue:#7ee08a; --in-delay:0.6s;  --sway-delay:-4.5s;" aria-label="BLOG">
          <span class="dp-btn-lift"><span class="dp-btn-sway"><img class="dp-btn-art" src="assets/btn-plate.png" alt="" draggable="false" /><span class="dp-btn-glow"></span><span class="dp-btn-current"></span></span><span class="dp-btn-scrim"></span><span class="dp-btn-label">BLOG</span></span>
        </a>
      </nav>
    </main>

    <footer class="dp-footer">
      <span class="dp-foot-code">&lt;/&gt;</span>
      <span class="dp-foot-text">© 2026 — Cultivé avec du bois, du code et de la lumière</span>
      <span class="dp-sparkle dp-foot-sparkle"></span>
    </footer>
  </div>

  <script>
    // Faint circuit-board backdrop tile, tinted with the accent (ported from
    // the prototype's circuitTile()). Set on .dp-root as --circuit-img.
    function circuitTile(hex) {
      const svg =
        `<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'>` +
        `<g fill='none' stroke='${hex}' stroke-width='1.3' stroke-linecap='round'>` +
        `<path d='M0 46 H64 V104 H132'/><path d='M220 64 H156 V132 H92'/>` +
        `<path d='M44 0 V46'/><path d='M176 220 V132'/>` +
        `<path d='M0 168 H86 V220'/><path d='M132 0 V34 H220'/>` +
        `<path d='M92 132 V196'/><path d='M156 132 H210'/>` +
        `</g><g fill='${hex}'>` +
        `<circle cx='64' cy='46' r='3.4'/><circle cx='132' cy='104' r='3.4'/>` +
        `<circle cx='156' cy='64' r='3.4'/><circle cx='92' cy='132' r='3.4'/>` +
        `<circle cx='86' cy='168' r='3.4'/><circle cx='132' cy='34' r='3.4'/>` +
        `</g></svg>`;
      const enc = svg.replace(/#/g, "%23").replace(/</g, "%3C").replace(/>/g, "%3E")
                     .replace(/"/g, "'").replace(/\s\s+/g, " ");
      return `url("data:image/svg+xml,${enc}")`;
    }

    const root = document.querySelector(".dp-root");
    const accent = getComputedStyle(root).getPropertyValue("--accent").trim() || "#9be35a";
    root.style.setProperty("--circuit-img", circuitTile(accent));

    // Floating glow spores (ported from the prototype's <Particles count={26} />).
    const SPORE_COUNT = 26;
    const particles = document.querySelector(".dp-particles");
    const frag = document.createDocumentFragment();
    for (let i = 0; i < SPORE_COUNT; i++) {
      const left = Math.random() * 100;
      const size = 2 + Math.random() * 5;
      const dur = 14 + Math.random() * 20;
      const delay = -Math.random() * 30;
      const drift = (Math.random() - 0.5) * 90;
      const op = 0.25 + Math.random() * 0.5;
      const s = document.createElement("span");
      s.className = "dp-spore";
      s.style.cssText =
        `left:${left}%;width:${size}px;height:${size}px;background:${accent};` +
        `opacity:${op};--drift:${drift}px;animation-duration:${dur}s;animation-delay:${delay}s`;
      frag.appendChild(s);
    }
    particles.appendChild(frag);

    // Entrance: flip the .is-in classes one tick after paint so the CSS
    // transitions fire (matches the prototype's mounted=true after 80ms).
    setTimeout(() => {
      document.querySelector(".dp-kicker").classList.add("is-in");
      document.querySelector(".dp-logo-wrap").classList.add("is-in");
      document.querySelector(".dp-headline").classList.add("is-in");
      document.querySelectorAll(".dp-btn").forEach((b) => b.classList.add("is-in"));
    }, 80);
  </script>
</body>
</html>
